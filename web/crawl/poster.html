<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Crawl · Poster</title>
<meta name="description" content="The six crawlers across all eight books, in The Crawl's poster style: each book's colors and type, one holo card, one clock.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bagel+Fat+One&family=Big+Shoulders+Display:wght@600;900&family=Chakra+Petch:wght@500;700&family=DM+Mono:wght@500&family=Instrument+Serif&family=Playfair+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="poster.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">The<br>Crawl</div>
    <ul class="roster" id="roster" aria-label="Crawlers and party view"></ul>
  </aside>

  <main class="stage" id="stage">
    <h1 class="name" id="name">Carl</h1>

    <div class="card-col">
      <div class="scene3d" id="scene3d" tabindex="0" role="button" aria-label="Crawler card. Press to flip, drag to tilt.">
        <div class="tilt" id="tilt">
          <div class="flip" id="flip">

            <div class="face front">
              <div class="window"><div class="pat"></div><div class="glow"></div><div class="halo"></div></div>
              <div class="badge lv locked" id="bLv"><small>Level</small><b>–</b></div>
              <div class="badge fl locked" id="bFl"><small>Floor</small><b>–</b><i id="bFlName"></i></div>
              <div class="panel">
                <div class="line1"><span id="line1Look">Look – / –</span><b id="line1Time">00:00:00</b></div>
                <div class="hexrow" id="hexes"></div>
              </div>
              <div class="holo foil"></div><div class="holo sparkle"></div><div class="holo glare"></div><div class="holo grain"></div>
            </div>

            <div class="figure" id="figure">
              <canvas id="hero" aria-hidden="true"></canvas>
              <div class="empty" id="empty" hidden>No look image bundled yet</div>
            </div>
            <div class="banner"><div class="nm" id="cardName">Carl</div><div class="ep" id="cardEp">Crawler</div></div>

            <div class="face rear">
              <div class="circuit"></div>
              <div class="emblem" aria-hidden="true">
                <svg viewBox="0 0 100 100"><defs><linearGradient id="gl" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#9ff3ff"/><stop offset=".5" stop-color="#ffb3e6"/><stop offset="1" stop-color="#d6ffa8"/></linearGradient></defs><polygon points="50,6 90,28 90,72 50,94 10,72 10,28" fill="none" stroke="url(#gl)" stroke-width="5"/><path d="M30 62 L40 34 L50 52 L60 34 L70 62 Z" fill="url(#gl)"/></svg>
              </div>
              <h3 style="top:31cqw">Skills <span id="skillCount"></span></h3>
              <div class="skills" id="skills"></div>
              <h3 style="top:78cqw">Gear</h3>
              <div class="loadout" id="loadout"></div>
              <div class="holo foil"></div><div class="holo sparkle"></div><div class="holo glare"></div><div class="holo grain"></div>
            </div>

          </div>
        </div>
      </div>
      <div class="card-hint" id="hint">Tap to flip</div>
    </div>
  </main>

  <footer class="timeline">
    <div class="tgroup">
      <button class="tbtn" id="btnPrev" type="button" aria-label="Previous look"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="tbtn play" id="btnPlay" type="button" aria-label="Play through the books" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="playIcon" d="M7 4l12 8-12 8z"/></svg></button>
      <button class="tbtn" id="btnNext" type="button" aria-label="Next look"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="track" id="track" role="slider" tabindex="0" aria-label="Position across the eight books" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="">
      <div class="bar" id="segs"></div>
      <div id="ticks"></div>
      <div class="head" id="head"><div class="lbl" id="headLbl">00:00:00</div><div class="knob"></div></div>
    </div>
    <div class="when" id="bookLbl">Book 1</div>
  </footer>
</div>

<div class="party" id="party" aria-hidden="true">
  <header>
    <div>
      <span class="eyebrow">Party</span>
      <h2>All six at one moment</h2>
      <span class="when" id="partyWhen"></span>
    </div>
    <button class="tbtn" id="btnClose" type="button" aria-label="Close party view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="row" id="members"></div>
</div>

<div class="loading" id="loading">Loading the crawl</div>

<script src="js/data.js"></script>
<script src="js/gl.js"></script>
<script src="js/poster.js"></script>
</body>
</html>
